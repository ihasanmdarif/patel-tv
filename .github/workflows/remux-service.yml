name: remux-service

# Builds and pushes the standalone remux service (remux-service/) — the FFmpeg piece
# that needs a persistent host, separate from the main app which deploys to Vercel.
on:
  push:
    branches: [main]
    paths:
      - "remux-service/**"
      - ".github/workflows/remux-service.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./remux-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/patel-tv-remux:latest
            ghcr.io/${{ github.repository_owner }}/patel-tv-remux:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional — only runs if DEPLOY_HOST is configured in repo secrets. SSHes into the
  # persistent host and pulls+restarts the service via its docker-compose.yml.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Pull and restart on host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_REMUX_PATH }}
            docker compose pull
            docker compose up -d
