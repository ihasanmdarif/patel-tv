name: deploy

# Builds and pushes both images (main app + remux-service) on every push to main,
# then optionally deploys the whole stack to the self-hosted box (docker-compose.yml)
# over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/patel-tv:latest
            ghcr.io/${{ github.repository_owner }}/patel-tv:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=app

  build-remux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./remux-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/patel-tv-remux:latest
            ghcr.io/${{ github.repository_owner }}/patel-tv-remux:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=remux

  # Runs directly on the self-hosted runner installed on the Proxmox VM itself
  # (Settings → Actions → Runners) — that box is LAN-only, so a GitHub-hosted
  # runner SSHing in from the public internet can never reach it. The runner
  # dials out to GitHub instead, same direction as the cloudflared tunnel.
  deploy:
    needs: [build-app, build-remux]
    runs-on: [self-hosted, proxmox]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and restart
        working-directory: /root/patel-tv
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f
